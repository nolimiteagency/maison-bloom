{"name": "Mettre a jour l'adresse du site", "on": {"workflow_dispatch": {}, "push": {"paths": [".github/workflows/adresse.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"adresse": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Remplacer l'ancienne adresse", "run": "set -e\nsed -i 's#kirujanrpz-code.github.io#nolimiteagency.github.io#g' index.html\nif grep -rq 'kirujanrpz-code' --exclude-dir=.git .; then grep -rn 'kirujanrpz-code' --exclude-dir=.git . | cut -c1-200; fi\ngrep -c 'nolimiteagency.github.io/maison-bloom/' index.html\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898+github-actions[bot]@users.noreply.github.com'\ngit add index.html\ngit diff --cached --quiet || git commit -m 'Adresse du site : nolimiteagency.github.io/maison-bloom'\ngit push"}]}}}
