{"name": "Mettre a jour l'adresse du site", "on": {"workflow_dispatch": {}, "push": {"paths": [".github/workflows/adresse.yml"]}}, "permissions": {"contents": "write"}, "jobs": {"adresse": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Adresse principale : maisonbloom-fr.vercel.app", "run": "set -e\nsed -i -e 's#https://kirujanrpz-code.github.io/maison-bloom/#https://maisonbloom-fr.vercel.app/#g' -e 's#https://nolimiteagency.github.io/maison-bloom/#https://maisonbloom-fr.vercel.app/#g' index.html\ngrep -o 'https://[a-z0-9.-]*/[a-z/.-]*' index.html | grep -E 'og:|vercel|github.io' | sort | uniq -c || true\ngrep -c 'https://maisonbloom-fr.vercel.app/' index.html\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898+github-actions[bot]@users.noreply.github.com'\ngit add index.html\ngit diff --cached --quiet || git commit -m 'Adresse du site : maisonbloom-fr.vercel.app'\ngit push"}]}}}
